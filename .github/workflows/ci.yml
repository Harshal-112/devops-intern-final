name: DevOps CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts and Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/sysinfo.sh scripts/healthcheck.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t devops-intern-final:test \
            ./app

  test:
    name: Test application
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t devops-intern-final:test \
            ./app

      - name: Start container
        run: |
          docker run -d --name devops-nginx \
            -p 8080:8080 \
            devops-intern-final:test

      - name: Wait for readiness
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs devops-nginx
          exit 1

      - name: Run health check script
        run: ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Verify build identifier
        run: |
          curl -fsS http://localhost:8080/ |
            grep -F "${GITHUB_SHA}"

      - name: Show logs on failure
        if: failure()
        run: docker logs devops-nginx

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
